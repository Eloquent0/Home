<!DOCTYPE html>
<html lang="en">
<head>
  <script src="./favicon_script_data.js"></script>
  <script src="./favicon_animator.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control This Room With Numbers or Something</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">
</head>
<body>

<canvas id="canvas"></canvas>
<div id="flash"></div>

<div id="empty">
  <img src="Untitled-12.png" alt="Load an image" class="empty-image" />
</div>

<div id="ui">
  <label for="file-input" class="btn-ui" id="load-btn">
    Insert Image
  </label>
  <input type="file" id="file-input" accept="image/*">

  <button class="btn-ui" id="restart-btn">
    Reset
  </button>
</div>


<div id="key-hints">
  <div class="hint-row"><span class="hint-text">
</span><span class="key-badge" data-key="1"></span></div>
  <div class="hint-row"><span class="hint-text"></span><span class="key-badge" data-key="2"></span></div>
  <div class="hint-row"><span class="hint-text"></span><span class="key-badge" data-key="3"></span></div>
  <div class="hint-row"><span class="hint-text"></span><span class="key-badge" data-key="4"></span></div>
  <div class="hint-row"><span class="hint-text"></span><span class="key-badge" data-key="5"></span></div>
  <div class="hint-row"><span class="hint-text"></span><span class="key-badge" data-key="6"></span></div>
  <div class="hint-row"><span class="hint-text"></span><span class="key-badge" data-key="7"></span></div>
  <div class="hint-row"><span class="hint-text"></span><span class="key-badge" data-key="8"></span></div>
  <div class="hint-row"><span class="hint-text"></span><span class="key-badge" data-key="9"></span></div>
</div>

<script src="script.js"></script>
</body>
</html>
